<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Неравенства: карточки + задания CSCA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #FBF6EE;
    margin: 0;
    padding: 22px 14px;
    color: #2A1E17;
  }
  #app { max-width: 900px; margin: 0 auto; }

  .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .title-block h1 { font-size: 20px; margin: 0 0 4px 0; color: #7A1F1F; }
  .title-block p { margin: 0; font-size: 12px; color: #8A7967; }
  .tabs { display: flex; gap: 6px; background: #fff; border: 1px solid #EAD9C0; border-radius: 12px; padding: 4px; }
  .tab-btn { border: none; background: transparent; color: #8A7967; padding: 8px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .tab-btn.active { background: #7A1F1F; color: #fff; }

  .pair-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pair-btn { border: 1.5px solid #EAD9C0; background: #fff; color: #6B5B4A; padding: 7px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .pair-btn.active { background: #C9A227; border-color: #C9A227; color: #fff; }
  .pair-btn:hover:not(.active) { background: #FBF0DC; }

  .flash-wrap { display: flex; flex-direction: column; align-items: center; }
  .flash-progress { font-size: 12.5px; color: #8A7967; margin-bottom: 10px; }
  .flashcard {
    width: 100%; max-width: 480px; min-height: 280px;
    background: #fff; border: 1.5px solid #EAD9C0; border-radius: 20px;
    box-shadow: 0 10px 28px rgba(122,31,31,0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 20px; cursor: pointer; position: relative; text-align: center;
  }
  .flash-front-zh { font-size: 54px; font-weight: 700; color: #2A1E17; margin-bottom: 8px; line-height: 1.2; }
  .flash-front-plain { font-size: 26px; font-weight: 700; color: #2A1E17; margin-bottom: 8px; }
  .flash-pinyin { font-size: 17px; color: #7A1F1F; font-weight: 600; margin-bottom: 4px; }
  .flash-hint { font-size: 11px; color: #B8A692; margin-top: 12px; font-style: italic; }
  .flash-back { font-size: 22px; font-weight: 700; color: #7A1F1F; margin-top: 6px; display: none; }
  .flashcard.flipped .flash-back { display: block; }
  .flashcard.flipped .flash-hint { display: none; }

  .speak-btn { margin-top: 14px; border: none; background: #7A1F1F; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(122,31,31,0.3); }
  .speak-btn:hover { background: #5C1717; }
  .speak-btn:active { transform: scale(0.95); }

  .flash-nav { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .nav-btn { border: 1.5px solid #EAD9C0; background: #fff; color: #7A1F1F; padding: 8px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .nav-btn:hover { background: #FBF0DC; }
  .nav-btn[disabled] { opacity: .4; cursor: default; }
  .shuffle-btn { border: none; background: #C9A227; color: #fff; padding: 8px 15px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  /* quiz */
  .quiz-score { font-size: 12.5px; color: #8A7967; margin-bottom: 10px; font-weight: 700; text-align: center; }
  .quiz-card { width: 100%; max-width: 520px; margin: 0 auto; background: #fff; border: 1.5px solid #EAD9C0; border-radius: 20px; box-shadow: 0 10px 28px rgba(122,31,31,0.08); padding: 28px 24px; text-align: center; }
  .quiz-prompt-zh { font-size: 44px; font-weight: 700; color: #2A1E17; margin-bottom: 6px; }
  .quiz-prompt-plain { font-size: 22px; font-weight: 700; color: #2A1E17; margin-bottom: 14px; }
  .quiz-pinyin { font-size: 15px; color: #7A1F1F; font-weight: 600; margin-bottom: 18px; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-opt { border: 1.5px solid #EAD9C0; background: #fff; color: #2A1E17; padding: 12px 10px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .quiz-opt:hover { border-color: #C9A227; background: #FBF0DC; }
  .quiz-opt.correct { background: #E7F3E2; border-color: #4C8B3B; color: #2E5A22; }
  .quiz-opt.wrong { background: #FBE7E5; border-color: #B23A2E; color: #7A1F1F; }
  .quiz-feedback { min-height: 20px; margin-top: 14px; font-size: 13px; font-weight: 700; }
  .quiz-feedback.ok { color: #2E5A22; }
  .quiz-feedback.bad { color: #B23A2E; }
  .quiz-next-btn { margin-top: 10px; border: none; background: #7A1F1F; color: #fff; padding: 9px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: none; }
  .quiz-done { text-align: center; padding: 18px; }
  .quiz-done h2 { color: #7A1F1F; font-size: 24px; margin-bottom: 8px; }

  /* CSCA tasks */
  .task-card { background: #fff; border: 1.5px solid #EAD9C0; border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .task-badge { display: inline-block; background: #C9A227; color: #fff; font-size: 10.5px; font-weight: 800; padding: 3px 11px; border-radius: 11px; margin-bottom: 10px; }
  .task-en { font-family: Consolas, monospace; font-size: 15px; font-weight: 700; color: #2A1E17; margin-bottom: 6px; }
  .task-zh { font-size: 15px; color: #444; margin-bottom: 12px; }
  .task-options { font-family: Consolas, monospace; font-size: 13px; color: #6B5B4A; margin-bottom: 10px; line-height: 1.6; }
  .task-reveal-btn { border: 1.5px solid #7A1F1F; background: #fff; color: #7A1F1F; padding: 6px 14px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .task-answer { display: none; margin-top: 10px; padding: 10px 14px; background: #E7F3E2; border-radius: 10px; font-size: 13.5px; color: #2E5A22; font-weight: 700; }
  .task-answer.shown { display: block; }

  .footer-note { text-align: center; font-size: 11px; color: #B5A48F; margin-top: 20px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const TERMS = [
    { zh:"不等式", pinyin:"bùděngshì", ru:"неравенство", en:"inequality" },
    { zh:"一元一次不等式", pinyin:"yīyuán yīcì bùděngshì", ru:"линейное неравенство", en:"linear inequality" },
    { zh:"一元二次不等式", pinyin:"yīyuán èrcì bùděngshì", ru:"квадратное неравенство", en:"quadratic inequality" },
    { zh:"分式不等式", pinyin:"fēnshì bùděngshì", ru:"рациональное (дробное) неравенство", en:"rational (fractional) inequality" },
    { zh:"不等式组", pinyin:"bùděngshì zǔ", ru:"система неравенств", en:"system of inequalities" },
    { zh:"解集", pinyin:"jiějí", ru:"множество решений", en:"solution set" },
    { zh:"区间", pinyin:"qūjiān", ru:"промежуток (интервал)", en:"interval" },
    { zh:"数轴", pinyin:"shùzhóu", ru:"числовая прямая", en:"number line" },
    { zh:"根", pinyin:"gēn", ru:"корень уравнения", en:"root" },
    { zh:"判别式", pinyin:"pànbiéshì", ru:"дискриминант", en:"discriminant" },
    { zh:"分子", pinyin:"fēnzǐ", ru:"числитель", en:"numerator" },
    { zh:"分母", pinyin:"fēnmǔ", ru:"знаменатель", en:"denominator" },
    { zh:"交集", pinyin:"jiāojí", ru:"пересечение", en:"intersection" },
    { zh:"空集", pinyin:"kōngjí", ru:"пустое множество", en:"empty set" },
    { zh:"符号", pinyin:"fúhào", ru:"знак (плюс/минус)", en:"sign" },
    { zh:"系数", pinyin:"xìshù", ru:"коэффициент", en:"coefficient" },
    { zh:"定义域", pinyin:"dìngyìyù", ru:"область определения", en:"domain" },
    { zh:"大于", pinyin:"dàyú", ru:"больше", en:"greater than" },
    { zh:"小于", pinyin:"xiǎoyú", ru:"меньше", en:"less than" },
  ];

  // Real CSCA exam tasks — English + Chinese, verified answers
  const TASKS = [
    { source:"CSCA · APRIL 2026 · №4", en:"The solution set of the inequality x² − 2x − 3 ≥ 0 is:", zh:"不等式 x² − 2x − 3 ≥ 0 的解集是：",
      opts:["A. (−∞,−1) ∪ (3,+∞)","B. [−1,3]","C. (−1,3)","D. (−∞,−1] ∪ [3,+∞)"], answer:"D" },
    { source:"CSCA · APRIL 2026 · №12", en:"The solution set of the inequality (2x+1)/(x−1) < 0 is:", zh:"不等式 (2x+1)/(x−1) < 0 的解集是：",
      opts:["A. (−1/2,1]","B. (−∞,−1/2] ∪ [1,+∞)","C. (−∞,−1/2) ∪ (1,+∞)","D. (−1/2,1)"], answer:"D" },
    { source:"CSCA · APRIL 2026 · №24", en:"If a,b,c are rational numbers and a > b, which is correct?", zh:"若 a, b, c 为有理数，且 a > b，则下列不等式中正确的是：",
      opts:["A. a−c < b−c","B. ac > bc","C. a/c > b/c","D. a+c > b+c"], answer:"D" },
    { source:"CSCA · DEC 2025 · №3", en:"The solution set of the quadratic inequality x² − 5x + 4 < 0 is:", zh:"不等式 x² − 5x + 4 < 0 的解集是：",
      opts:["A. (−4,−1)","B. (−∞,1) ∪ (4,+∞)","C. (−∞,−4) ∪ (−1,+∞)","D. (1,4)"], answer:"D" },
    { source:"CSCA · JAN 2026 · №3", en:"The solution set of the inequality x² − x − 2 > 0 is:", zh:"不等式 x² − x − 2 > 0 的解集是：",
      opts:["A. {x | x<−2 or x>−1}","B. {x | x<−1 or x>2}","C. {x | −2<x<1}","D. {x | −1<x<2}"], answer:"B" },
    { source:"CSCA · MAR 2026 · №3", en:"The solution set of the inequality x² − x − 6 > 0 is:", zh:"不等式 x² − x − 6 > 0 的解集是：",
      opts:["A. {x | x<−2 or x>3}","B. {x | −2<x<3}","C. {x | x>3}","D. {x | x<−2}"], answer:"A" },
    { source:"CSCA · первый тест · №5", en:"Given (x−2)(x+1) < 0, the solution set of the inequality is:", zh:"已知 (x−2)(x+1) < 0，该不等式的解集是：",
      opts:["A. [−1,2]","B. (−1,2)","C. [−1,2)","D. (−1,2]"], answer:"B" },
    { source:"CSCA · первый тест · №2", en:"If a > b, which of the following statements is correct?", zh:"若 a > b，则下列说法中正确的是：",
      opts:["A. 3a < 3b","B. a/3 < b/3","C. a+3 > b−3","D. a−b < 0"], answer:"C" },
  ];

  let mode = "flash"; // "flash" | "quiz" | "tasks"
  let pair = "en-zh"; // "ru-en" | "ru-zh" | "en-zh"
  let flashIndex = 0;
  let flashOrder = TERMS.map((_, i) => i);

  let quizPool = [];
  let quizIndex = 0;
  let quizScore = 0;
  let quizAnswered = false;
  let quizTotal = 0;

  const app = document.getElementById("app");

  function pairLabels() {
    // returns { frontLang, backLang, frontKey, backKey, hasZh }
    if (pair === "ru-en") return { hasZh:false, frontKey:"ru", backKey:"en", frontLabel:"RU", backLabel:"EN" };
    if (pair === "ru-zh") return { hasZh:true, frontKey:"zh", backKey:"ru", frontLabel:"中文", backLabel:"RU" };
    return { hasZh:true, frontKey:"zh", backKey:"en", frontLabel:"中文", backLabel:"EN" }; // en-zh
  }

  function render(){
    app.innerHTML = `
      <div class="header">
        <div class="title-block">
          <h1>不等式 · Неравенства · Inequalities</h1>
          <p>Карточки на 3 пары языков + реальные задания CSCA на английском и китайском</p>
        </div>
        <div class="tabs">
          <button class="tab-btn ${mode==='flash'?'active':''}" id="tabFlash">📇 Карточки</button>
          <button class="tab-btn ${mode==='quiz'?'active':''}" id="tabQuiz">🎯 Тест</button>
          <button class="tab-btn ${mode==='tasks'?'active':''}" id="tabTasks">📝 Задания CSCA</button>
        </div>
      </div>
      <div id="modeArea"></div>
      <div class="footer-note">Произношение через синтез речи браузера (лучше всего в Chrome). ${TERMS.length} терминов · ${TASKS.length} реальных заданий CSCA.</div>
    `;
    document.getElementById("tabFlash").addEventListener("click", () => { mode = "flash"; render(); });
    document.getElementById("tabQuiz").addEventListener("click", () => { mode = "quiz"; resetQuiz(); render(); });
    document.getElementById("tabTasks").addEventListener("click", () => { mode = "tasks"; render(); });

    if (mode === "flash") renderFlash();
    else if (mode === "quiz") renderQuiz();
    else renderTasks();
  }

  function speak(text){
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.82;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  function pairBar(onChange) {
    const wrap = document.createElement("div");
    wrap.className = "pair-bar";
    const options = [["ru-en","RU ↔ EN"],["ru-zh","RU ↔ 中文"],["en-zh","EN ↔ 中文"]];
    options.forEach(([key,label]) => {
      const btn = document.createElement("button");
      btn.className = "pair-btn" + (pair===key ? " active" : "");
      btn.textContent = label;
      btn.addEventListener("click", () => { pair = key; onChange(); });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  // ================= FLASHCARD MODE =================
  function renderFlash(){
    const modeArea = document.getElementById("modeArea");
    modeArea.innerHTML = "";
    modeArea.appendChild(pairBar(() => { flashIndex = 0; renderFlash(); }));

    const labels = pairLabels();
    const term = TERMS[flashOrder[flashIndex]];

    const wrap = document.createElement("div");
    wrap.className = "flash-wrap";
    wrap.innerHTML = `
      <div class="flash-progress">${flashIndex+1} / ${flashOrder.length} · ${labels.frontLabel} → ${labels.backLabel}</div>
      <div class="flashcard" id="flashcard">
        ${labels.hasZh
          ? `<div class="flash-front-zh">${term.zh}</div><div class="flash-pinyin">${term.pinyin}</div>`
          : `<div class="flash-front-plain">${term[labels.frontKey]}</div>`}
        <div class="flash-hint">нажми на карточку, чтобы увидеть перевод</div>
        <div class="flash-back">${term[labels.backKey]}</div>
        ${labels.hasZh ? `<button class="speak-btn" id="speakBtn" title="Прослушать произношение">🔊</button>` : ``}
      </div>
      <div class="flash-nav">
        <button class="nav-btn" id="prevBtn" ${flashIndex===0?"disabled":""}>← Назад</button>
        <button class="shuffle-btn" id="shuffleBtn">🔀 Перемешать</button>
        <button class="nav-btn" id="nextBtn" ${flashIndex===flashOrder.length-1?"disabled":""}>Далее →</button>
      </div>
    `;
    modeArea.appendChild(wrap);

    const card = document.getElementById("flashcard");
    card.addEventListener("click", (e) => {
      if (e.target.id === "speakBtn") return;
      card.classList.toggle("flipped");
    });
    const speakBtn = document.getElementById("speakBtn");
    if (speakBtn) speakBtn.addEventListener("click", (e) => { e.stopPropagation(); speak(term.zh); });
    document.getElementById("prevBtn").addEventListener("click", () => { if (flashIndex>0) { flashIndex--; renderFlash(); } });
    document.getElementById("nextBtn").addEventListener("click", () => { if (flashIndex<flashOrder.length-1) { flashIndex++; renderFlash(); } });
    document.getElementById("shuffleBtn").addEventListener("click", () => {
      for (let i = flashOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashOrder[i], flashOrder[j]] = [flashOrder[j], flashOrder[i]];
      }
      flashIndex = 0;
      renderFlash();
    });
  }

  // ================= QUIZ MODE =================
  function resetQuiz(){
    quizPool = TERMS.map((_, i) => i);
    for (let i = quizPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [quizPool[i], quizPool[j]] = [quizPool[j], quizPool[i]];
    }
    quizIndex = 0; quizScore = 0; quizAnswered = false; quizTotal = quizPool.length;
  }

  function buildOptions(correctIdx, key){
    const correctTerm = TERMS[correctIdx];
    const pool = TERMS.map((t,i)=>i).filter(i => i !== correctIdx);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const distractors = pool.slice(0, 3).map(i => TERMS[i][key]);
    const options = [correctTerm[key], ...distractors];
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    return options;
  }

  function renderQuiz(){
    const modeArea = document.getElementById("modeArea");
    modeArea.innerHTML = "";
    modeArea.appendChild(pairBar(() => { resetQuiz(); renderQuiz(); }));
    const labels = pairLabels();

    if (quizIndex >= quizTotal) {
      const doneDiv = document.createElement("div");
      doneDiv.innerHTML = `
        <div class="quiz-card quiz-done">
          <h2>Тест завершён! 🎉</h2>
          <p>Правильных ответов: <b>${quizScore} из ${quizTotal}</b></p>
          <button class="quiz-next-btn" id="restartBtn" style="display:inline-block;">Пройти ещё раз</button>
        </div>`;
      modeArea.appendChild(doneDiv);
      document.getElementById("restartBtn").addEventListener("click", () => { resetQuiz(); renderQuiz(); });
      return;
    }

    quizAnswered = false;
    const idx = quizPool[quizIndex];
    const term = TERMS[idx];
    const options = buildOptions(idx, labels.backKey);

    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="quiz-score">Вопрос ${quizIndex+1} из ${quizTotal} · правильно: ${quizScore} · ${labels.frontLabel} → ${labels.backLabel}</div>
      <div class="quiz-card">
        ${labels.hasZh
          ? `<div class="quiz-prompt-zh">${term.zh}</div><div class="quiz-pinyin">${term.pinyin}</div>`
          : `<div class="quiz-prompt-plain">${term[labels.frontKey]}</div>`}
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="quiz-next-btn" id="quizNextBtn">Далее →</button>
      </div>`;
    modeArea.appendChild(wrap);

    const optDiv = document.getElementById("quizOptions");
    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt;
      btn.addEventListener("click", () => checkQuizAnswer(opt, term[labels.backKey], btn));
      optDiv.appendChild(btn);
    });

    if (labels.hasZh) speak(term.zh);
  }

  function checkQuizAnswer(chosen, correct, btn){
    if (quizAnswered) return;
    quizAnswered = true;
    const feedback = document.getElementById("quizFeedback");
    document.querySelectorAll(".quiz-opt").forEach(b => {
      b.style.pointerEvents = "none";
      if (b.textContent === correct) b.classList.add("correct");
    });
    if (chosen === correct) {
      quizScore++;
      feedback.textContent = "Верно! ✓";
      feedback.className = "quiz-feedback ok";
    } else {
      btn.classList.add("wrong");
      feedback.textContent = "Неверно. Правильный ответ отмечен зелёным.";
      feedback.className = "quiz-feedback bad";
    }
    document.getElementById("quizNextBtn").style.display = "inline-block";
    document.getElementById("quizNextBtn").addEventListener("click", () => { quizIndex++; renderQuiz(); });
  }

  // ================= CSCA TASKS MODE =================
  function renderTasks(){
    const modeArea = document.getElementById("modeArea");
    modeArea.innerHTML = "";
    const intro = document.createElement("p");
    intro.style.cssText = "font-size:12.5px;color:#8A7967;margin:0 0 14px 0;";
    intro.textContent = "Реальные задания прямо из твоих экзаменов CSCA — на английском и китайском. Нажми «Показать ответ», чтобы проверить себя.";
    modeArea.appendChild(intro);

    TASKS.forEach((t, i) => {
      const card = document.createElement("div");
      card.className = "task-card";
      card.innerHTML = `
        <div class="task-badge">${t.source}</div>
        <div class="task-en">${i+1}. ${t.en}</div>
        <div class="task-zh">${t.zh}</div>
        <div class="task-options">${t.opts.join("&nbsp;&nbsp;&nbsp;")}</div>
        <button class="task-reveal-btn" id="reveal${i}">Показать ответ</button>
        <div class="task-answer" id="answer${i}">Ответ: ${t.answer}</div>
      `;
      modeArea.appendChild(card);
    });

    TASKS.forEach((t, i) => {
      document.getElementById(`reveal${i}`).addEventListener("click", () => {
        document.getElementById(`answer${i}`).classList.toggle("shown");
      });
    });
  }

  render();
})();
</script>
</body>
</html>
